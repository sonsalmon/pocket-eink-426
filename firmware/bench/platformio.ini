; Bench test for the Pocket426 pin map on an off-the-shelf ESP32-C3 board
; (e.g. ESP32-C3 SuperMini, 4 MB flash) + Waveshare 4.26inch e-Paper HAT.
; It checks the panel, partial/full refresh times and the 3-key ADC ladder;
; the full CrossPoint image needs 16 MB and runs on the real board.
[env:bench]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  zinggjm/GxEPD2@1.6.9
  adafruit/Adafruit GFX Library@1.12.1
